<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Suivi du budget familial prévisionnel : ressources, dépenses, imprévus, objectifs et tableau de bord.">
<meta name="theme-color" content="#0E4D36">
<title>BudgetFoyer — Budget familial prévisionnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#EAEFEA;--surface:#FFFFFF;--surface-2:#F4F7F3;--ink:#13221A;--muted:#56675D;--line:#D3DCD5;
  --brand:#0E4D36;--brand-2:#16684A;--side:#0E4D36;--side-ink:#D5E8DC;--side-active:#F2B45A;
  --accent:#D9650F;--gold:#B7862A;--red:#B3361F;--ok:#1B7A4B;--warn:#B8740A;
  --fd:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Source Sans 3',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1410;--surface:#121D18;--surface-2:#172620;--ink:#E4EEE7;--muted:#9BB0A3;--line:#243830;
  --brand:#4DBB8A;--brand-2:#6ED0A4;--side:#08170F;--side-ink:#B9D3C4;--side-active:#F2B45A;
  --accent:#F08A36;--gold:#E0B24E;--red:#EE6A52;--ok:#4DBB8A;--warn:#E3A43A;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1410;--surface:#121D18;--surface-2:#172620;--ink:#E4EEE7;--muted:#9BB0A3;--line:#243830;
  --brand:#4DBB8A;--brand-2:#6ED0A4;--side:#08170F;--side-ink:#B9D3C4;--side-active:#F2B45A;
  --accent:#F08A36;--gold:#E0B24E;--red:#EE6A52;--ok:#4DBB8A;--warn:#E3A43A;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.9rem}h2{font-size:1.35rem}h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
img,svg,canvas{max-width:100%}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.hidden{display:none!important}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line);background:var(--surface);padding:.55rem .9rem;border-radius:10px;cursor:pointer;font-weight:600;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#07140E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#07140E}}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--red)}
.btn.sm{padding:.35rem .6rem;font-size:.85rem;border-radius:8px}
.icon-btn{border:0;background:transparent;padding:.35rem;border-radius:8px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
label.f{display:grid;gap:.3rem;font-weight:600;font-size:.9rem}
label.f span.h{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.check{display:flex;gap:.55rem;align-items:flex-start;font-size:.95rem;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--brand)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.fgrid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

/* Auth */
#root{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#root>*{flex:1}
.auth{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.side .badge{background:rgba(255,255,255,.12);color:#fff}
.auth-brand{background:var(--side);color:#EAF4EE;padding:clamp(28px,6vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.auth-brand::after{content:"";position:absolute;right:-120px;bottom:-120px;width:380px;height:380px;border-radius:50%;border:48px solid rgba(242,180,90,.18)}
.logo{display:flex;align-items:center;gap:.6rem;font-family:var(--fd);font-weight:800;font-size:1.35rem}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--side-active);display:grid;place-items:center;color:#0E4D36}
.auth-brand h1{font-size:clamp(2rem,4.2vw,3.2rem);max-width:14ch;font-weight:800}
.auth-brand .lead{max-width:44ch;color:#C9DED1;margin-top:1rem;font-size:1.08rem}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:.9rem;max-width:420px;position:relative;z-index:1}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:.8rem;align-items:start}
.steps b{font-family:var(--fd);width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(242,180,90,.7);display:grid;place-items:center;color:var(--side-active)}
.steps span{color:#C9DED1;font-size:.95rem}.steps strong{color:#fff;display:block}
.auth-panel{display:grid;place-items:center;padding:32px 20px}
.auth-card{width:min(430px,100%);display:grid;gap:1.1rem}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:.55rem;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.err{color:var(--red);font-size:.9rem;min-height:1.2em}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--gold);padding-left:.7rem}

/* Shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:22px 14px}
.side .logo{color:#fff;padding:0 8px 22px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:.7rem;width:100%;border:0;background:transparent;color:var(--side-ink);padding:.62rem .75rem;border-radius:10px;cursor:pointer;font-weight:600;text-align:left;font-size:.96rem}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[aria-current=page]{background:rgba(242,180,90,.14);color:#fff;box-shadow:inset 3px 0 0 var(--side-active)}
.nav svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.88rem}
.side-foot .who{color:#fff;font-weight:600}
.side-foot button{color:var(--side-ink);background:transparent;border:0;padding:.3rem 0;cursor:pointer;text-decoration:underline}
main{padding:clamp(18px,3vw,34px);max-width:1240px;width:100%;margin:0 auto;padding-bottom:110px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
.vh .sub{color:var(--muted);margin-top:.3rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,2vw,22px)}
.card h3{margin-bottom:.9rem}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin-bottom:.9rem;flex-wrap:wrap}
.card-head h3{margin:0}
.stack{display:grid;gap:1.1rem;grid-template-columns:minmax(0,1fr)}
.grid2{display:grid;gap:1.1rem;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{display:grid;gap:1.1rem;grid-template-columns:repeat(3,minmax(0,1fr))}

/* Period bar */
.pbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:.4rem .7rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed=true]{color:#07140E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed=true]{color:#07140E}}
.stepper{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px}
.stepper button{border:0;background:transparent;padding:.45rem .6rem;cursor:pointer;color:var(--muted);font-size:1.05rem}
.stepper span{min-width:150px;text-align:center;font-weight:600;font-size:.93rem}

/* Ledger (hero) */
.ledger{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:clamp(16px,3vw,36px);align-items:center}
.solde-label{color:var(--muted);font-weight:600}
.solde{font-family:var(--fd);font-size:clamp(1.9rem,3.4vw,3rem);font-weight:800;line-height:1;letter-spacing:-.02em;margin:.35rem 0 .6rem;font-variant-numeric:tabular-nums}
.solde.neg{color:var(--red)}.solde.pos{color:var(--ok)}
.verdict{font-size:.98rem;max-width:44ch}
.beam{position:relative;height:46px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.beam i{display:block;height:100%}
.beam .over{background:repeating-linear-gradient(135deg,var(--red) 0 7px,color-mix(in srgb,var(--red) 55%,transparent) 7px 14px)}
.beam-mark{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--ink)}
.beam-wrap{position:relative;padding-top:26px}
.beam-mark-l{position:absolute;top:0;transform:translateX(-50%);font-size:.8rem;font-weight:700;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin-top:.8rem;font-size:.86rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.1rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:.2rem;min-width:0}
.kpi .k{color:var(--muted);font-weight:600;font-size:.9rem}
.kpi .v{font-family:var(--fd);font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:.85rem;color:var(--muted)}
.up{color:var(--ok)}.down{color:var(--red)}
.meter{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:.45rem}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}

.chart{position:relative;height:270px}
.chart.sm{height:230px}

/* Tables */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.94rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.84rem;padding:.55rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.6rem;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.group td{background:var(--surface-2);font-weight:700;font-family:var(--fd);font-size:.92rem}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.badge{display:inline-block;padding:.12rem .5rem;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.b-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.b-red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.b-neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pbarmini{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.pbarmini i{display:block;height:100%;border-radius:99px}
.plan-in{max-width:150px;text-align:right;min-height:36px!important;padding:.4rem .5rem!important}

/* Alerts */
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
.alerts li{display:grid;grid-template-columns:10px 1fr;gap:.7rem;font-size:.93rem;align-items:start}
.alerts li::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:.4rem;background:var(--c,var(--muted))}

/* Goals */
.goal{display:grid;gap:.5rem}
.goal .top{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.bigbar{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bigbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold))}

/* Cat list */
.catlist{list-style:none;margin:0;padding:0}
.catlist li{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.catlist li .n{flex:1;min-width:0}
.swatch{width:14px;height:14px;border-radius:4px;flex:none}

/* Method */
.prose h3{margin:1.2rem 0 .5rem}
.prose p,.prose li{max-width:70ch}
.prose ul{padding-left:1.2rem;margin:.3rem 0}
.quote{font-family:var(--fd);font-size:1.25rem;line-height:1.35;border-left:4px solid var(--side-active);padding-left:1rem;max-width:40ch}

/* FAB, dialog, toast */
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 8px 24px rgba(14,77,54,.35);border-radius:14px;padding:.8rem 1.1rem}
dialog{border:1px solid var(--line);border-radius:18px;padding:0;width:min(560px,94vw);background:var(--surface);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(6,20,13,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px}
.dlg-b{padding:10px 20px 6px;display:grid;gap:.9rem;grid-template-columns:minmax(0,1fr)}
.dlg-f{display:flex;justify-content:flex-end;gap:.6rem;padding:14px 20px 20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.65rem 1rem;border-radius:12px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.typeswitch{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.typeswitch button{border:1px solid var(--line);background:var(--surface-2);padding:.6rem;border-radius:10px;font-weight:700;cursor:pointer}
.typeswitch button[aria-pressed=true].exp{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--accent)}
.typeswitch button[aria-pressed=true].inc{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:var(--ok);color:var(--ok)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--fd);font-size:1.1rem;margin-bottom:.3rem}

/* Mobile nav */
.bnav{display:none}
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .ledger{grid-template-columns:minmax(0,1fr)}
  .auth{grid-template-columns:1fr}
  .auth-brand{padding:28px 22px}
  .auth-brand .steps{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--side);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  .bnav button{flex:1 0 64px;border:0;background:transparent;color:var(--side-ink);display:grid;justify-items:center;gap:2px;font-size:.7rem;font-weight:600;padding:6px 2px;border-radius:10px;cursor:pointer}
  .bnav button[aria-current=page]{color:var(--side-active);background:rgba(255,255,255,.06)}
  .bnav svg{width:20px;height:20px}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:16px}
  .mtop{display:flex!important}
  h1{font-size:1.55rem}
}
.mtop{display:none;justify-content:space-between;align-items:center;margin-bottom:1rem}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}.kpi{padding:12px}.kpi .v{font-size:1.02rem}.stepper span{min-width:118px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .side,.bnav,.fab,.pbar .seg,.stepper button,.noprint{display:none!important}
  .app{display:block} body{background:#fff} .card,.kpi{break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
"use strict";
/* ============ Stockage (localStorage avec repli mémoire) ============ */
const MEM={};
const store={
  get(k){try{const r=localStorage.getItem(k);if(r!==null)return JSON.parse(r)}catch(e){}return k in MEM?MEM[k]:null},
  set(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){delete MEM[k];try{localStorage.removeItem(k)}catch(e){}}
};
const sess={
  get(){try{return sessionStorage.getItem('bf_session')||store.get('bf_session')}catch(e){return store.get('bf_session')}},
  set(id,remember){try{sessionStorage.setItem('bf_session',id)}catch(e){} if(remember)store.set('bf_session',id)},
  clear(){try{sessionStorage.removeItem('bf_session')}catch(e){} store.del('bf_session')}
};

/* ============ Utilitaires ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const NF=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const cur=()=>(D&&D.settings.currency)||'FCFA';
const fmt=n=>NF.format(Math.round(n||0))+'\u00A0'+cur();
const fmtS=n=>(n>0?'+':n<0?'−':'')+NF.format(Math.abs(Math.round(n||0)))+'\u00A0'+cur();
const pc=x=>isFinite(x)&&!isNaN(x)?Math.round(x*100)+'\u00A0%':'—';
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MSHORT=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const ymOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const today=()=>{const d=new Date();return ymOf(d)+'-'+String(d.getDate()).padStart(2,'0')};
const ml=ym=>{const[y,m]=ym.split('-');return MONTHS[+m-1]+' '+y};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const prevYm=ym=>{const[y,m]=ym.split('-').map(Number);return ymOf(new Date(y,m-2,1))};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2600)}
async function sha(s){
  try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16);
}

const PN={m:12,q:4,s:2,y:1};
function periodMonths(p=P){let a,b;if(p.type==='m'){a=b=p.idx}else if(p.type==='q'){a=p.idx*3;b=a+2}else if(p.type==='s'){a=p.idx*6;b=a+5}else{a=0;b=11}const r=[];for(let m=a;m<=b;m++)r.push(p.year+'-'+String(m+1).padStart(2,'0'));return r}
function periodLabel(p=P){if(p.type==='m')return cap(MONTHS[p.idx])+' '+p.year;if(p.type==='q')return 'T'+(p.idx+1)+' '+p.year+' ('+MSHORT[p.idx*3]+' – '+MSHORT[p.idx*3+2]+')';if(p.type==='s')return (p.idx+1)+'er'.replace('1er','1er')+' semestre '+p.year;return 'Année '+p.year}
function semLabel(p){return (p.idx===0?'1er':'2e')+' semestre '+p.year}
function setPType(t){const a=+periodMonths()[0].slice(5)-1;P={type:t,year:P.year,idx:t==='m'?a:t==='q'?Math.floor(a/3):t==='s'?Math.floor(a/6):0};render()}
function shiftP(d){let i=P.idx+d,y=P.year;const n=PN[P.type];if(i<0){y--;i=n-1}if(i>=n){y++;i=0}P={type:P.type,year:y,idx:i};render()}
function pLabel(){return P.type==='s'?semLabel(P):periodLabel(P)}

function agg(months){
  const set=new Set(months),plan={},real={};
  D.categories.forEach(c=>{plan[c.id]=0;real[c.id]=0});
  months.forEach(m=>{const b=D.budgets[m]||{};for(const k in b)if(k in plan)plan[k]+=+b[k]||0});
  let noReceipt=0;
  D.transactions.forEach(t=>{if(set.has(t.date.slice(0,7))&&t.catId in real){real[t.catId]+=+t.amount||0;const c=catById(t.catId);if(c&&c.kind==='expense'&&!t.receipt)noReceipt++}});
  const r={plan,real,incP:0,incR:0,expP:0,expR:0,savP:0,savR:0,impP:0,impR:0,noReceipt,byNat:{}};
  Object.keys(NAT).forEach(k=>r.byNat[k]=0);
  D.categories.forEach(c=>{
    if(c.kind==='income'){r.incP+=plan[c.id];r.incR+=real[c.id]}
    else{r.expP+=plan[c.id];r.expR+=real[c.id];r.byNat[c.nature]=(r.byNat[c.nature]||0)+real[c.id];
      if(c.bucket==='epargne'){r.savP+=plan[c.id];r.savR+=real[c.id]}
      if(c.nature==='imprevu'){r.impP+=plan[c.id];r.impR+=real[c.id]}}
  });
  r.soldeP=r.incP-r.expP;r.soldeR=r.incR-r.expR;
  return r;
}
function fundState(){
  const fc=D.categories.filter(c=>c.fund).map(c=>c.id);
  let bal=0;D.transactions.forEach(t=>{if(fc.includes(t.catId))bal+=+t.amount||0;if(t.fromFund)bal-=+t.amount||0});
  const b=D.budgets[ymOf(NOW)]||D.budgets[prevYm(ymOf(NOW))]||{};
  let ess=0;D.categories.forEach(c=>{if(c.kind==='expense'&&c.bucket==='besoins'&&c.nature!=='imprevu')ess+=+b[c.id]||0});
  const target=ess*(+D.settings.fundMonths||3);
  return{bal,target,ess,ratio:target?bal/target:0};
}
function verdict(s,planned){
  if(s<0)return planned?'Budget déséquilibré : réduisez, reportez ou annulez des dépenses, ou cherchez des revenus supplémentaires avant d’engager le mois.':'Les dépenses dépassent les ressources : réduisez, reportez ou annulez des dépenses, ou augmentez les revenus.';
  if(s>0)return 'Solde positif : épargnez l’excédent ou affectez-le à un projet de la famille.';
  return 'Budget à l’équilibre exact.';
}

async function doLogin(e){
  e.preventDefault();
  const email=$('#a-email').value.trim().toLowerCase(),pass=$('#a-pass').value;
  const u=users().find(x=>x.email===email);
  if(!u||await sha(u.salt+pass)!==u.hash){$('#a-err').textContent='E-mail ou mot de passe incorrect.';return}
  sess.set(u.id,$('#a-rem').checked);startApp(u);
}
async function doSignup(e){
  e.preventDefault();
  const name=$('#s-name').value.trim(),email=$('#s-email').value.trim().toLowerCase(),pass=$('#s-pass').value;
  if(pass.length<8){$('#s-err').textContent='Le mot de passe doit contenir au moins 8 caractères.';return}
  const all=users();if(all.some(x=>x.email===email)){$('#s-err').textContent='Un compte existe déjà avec cet e-mail sur cet appareil.';return}
  const salt=uid()+uid();const u={id:uid(),name,email,salt,hash:await sha(salt+pass),created:today()};
  all.push(u);store.set('bf_users',all);
  const d=newData({name,household:$('#s-house').value.trim()||'Famille '+name.split(' ').slice(-1)[0],rule:$('#s-rule').value});
  if($('#s-demo').checked)seedDemo(d);
  store.set('bf_data_'+u.id,d);sess.set(u.id,true);startApp(u);toast('Compte créé. Bienvenue !');
}

/* ============ Tableau de bord ============ */
function viewDash(){
  const months=periodMonths(),a=agg(months),rule=RULES[D.settings.rule]||RULES['50/20/30'];
  const hasData=a.incP||a.incR||a.expP||a.expR;
  const base=Math.max(a.incR,a.expR,1);
  const segs=Object.keys(NAT).filter(k=>a.byNat[k]>0);
  let used=0;
  const beam=segs.map(k=>{let w=a.byNat[k]/base*100;const within=Math.max(0,Math.min(w,(a.incR/base*100)-used));const over=w-within;used+=w;
    return `<i style="width:${within}%;background:${NAT[k].c}" title="${NAT[k].l} : ${fmt(a.byNat[k])}"></i>${over>0.01?`<i class="over" style="width:${over}%" title="Dépassement"></i>`:''}`}).join('');
  const markL=Math.min(100,a.incR/base*100);
  const savRate=a.incR?a.savR/a.incR:NaN,exec=a.expP?a.expR/a.expP:NaN,incExec=a.incP?a.incR/a.incP:NaN;
  const fund=fundState();
  const alerts=buildAlerts(a,fund);
  const ecarts=D.categories.map(c=>({c,p:a.plan[c.id],r:a.real[c.id]})).filter(x=>x.p||x.r)
    .map(x=>({...x,e:x.r-x.p,t:x.p?x.r/x.p:NaN})).sort((x,y)=>Math.abs(y.e)-Math.abs(x.e)).slice(0,12);
  const tip=TIPS[(NOW.getDate()+months.length)%TIPS.length];
  return `
  <header class="vh"><div><h1>Tableau de bord</h1><p class="sub">${esc(D.profile.household)}, ${pLabel().toLowerCase()}</p></div>${periodBar()}</header>
  ${!hasData?`<div class="card empty"><strong>Aucune donnée sur cette période</strong>Saisissez votre budget prévisionnel puis vos opérations.<div class="row" style="justify-content:center;margin-top:1rem"><button class="btn primary" onclick="BM='${months[0]}';go('budget')">Préparer le budget</button><button class="btn" onclick="openTx()">Noter une opération</button></div></div>`:`
  <div class="stack">
  <section class="card ledger" aria-label="Solde de la période">
    <div>
      <p class="solde-label">Solde réalisé (ressources − dépenses)</p>
      <p class="solde ${a.soldeR<0?'neg':'pos'}">${fmtS(a.soldeR)}</p>
      <p class="verdict">${verdict(a.soldeR)}</p>
      <p class="muted small" style="margin-top:.6rem">Solde prévisionnel : <strong>${fmtS(a.soldeP)}</strong></p>
    </div>
    <div>
      <div class="beam-wrap">
        <span class="beam-mark-l" style="left:${markL}%;transform:translateX(${markL>65?-100:markL<20?0:-50}%)">Ressources ${fmt(a.incR)}</span>
        <div class="beam" role="img" aria-label="Dépenses ${fmt(a.expR)} pour des ressources de ${fmt(a.incR)}">${beam||''}</div>
        <span class="beam-mark" style="left:${markL}%;top:20px;height:58px"></span>
      </div>
      <div class="legend">${segs.map(k=>`<span><i class="dot" style="background:${NAT[k].c}"></i>${NAT[k].l} ${fmt(a.byNat[k])}</span>`).join('')}${a.expR>a.incR?`<span><i class="dot" style="background:var(--red)"></i>Dépassement ${fmt(a.expR-a.incR)}</span>`:''}</div>
    </div>
  </section>
  <div class="kpis">
    <div class="kpi"><span class="k">Ressources</span><span class="v">${fmt(a.incR)}</span><span class="s">Prévu ${fmt(a.incP)} · ${pc(incExec)}</span><div class="meter"><i style="width:${Math.min(100,(incExec||0)*100)}%;background:var(--ok)"></i></div></div>
    <div class="kpi"><span class="k">Dépenses</span><span class="v">${fmt(a.expR)}</span><span class="s">Prévu ${fmt(a.expP)} · exécution ${pc(exec)}</span><div class="meter"><i style="width:${Math.min(100,(exec||0)*100)}%;background:${exec>1?'var(--red)':exec>.9?'var(--warn)':'var(--accent)'}"></i></div></div>
    <div class="kpi"><span class="k">Taux d’épargne</span><span class="v">${pc(savRate)}</span><span class="s">${fmt(a.savR)} épargnés</span><div class="meter"><i style="width:${Math.min(100,(savRate||0)*100/((rule.slices.find(s=>s.l==='Épargne')||{p:20}).p/100))}%;background:var(--gold)"></i></div></div>
    <div class="kpi"><span class="k">Imprévus</span><span class="v">${fmt(a.impR)}</span><span class="s">Budget ${fmt(a.impP)} · fonds ${pc(fund.ratio)}</span><div class="meter"><i style="width:${Math.min(100,fund.ratio*100)}%;background:var(--red)"></i></div></div>
  </div>
  <div class="grid2">
    <section class="card"><div class="card-head"><h3>Évolution ${P.year}</h3><span class="muted small">Réalisé mensuel</span></div><div class="chart"><canvas id="c1" aria-label="Ressources et dépenses par mois"></canvas></div></section>
    <section class="card"><div class="card-head"><h3>Où va l’argent</h3><span class="muted small">Dépenses réalisées</span></div><div class="chart"><canvas id="c2" aria-label="Répartition des dépenses"></canvas></div></section>
  </div>
  <div class="grid2">
    <section class="card"><div class="card-head"><h3>${rule.name}</h3><button class="btn sm ghost" onclick="go('settings')">Changer</button></div>
      <p class="muted small" style="margin-bottom:.6rem">Part réelle des ressources comparée à la cible.</p>
      <div class="chart sm"><canvas id="c3" aria-label="Comparaison à la règle"></canvas></div></section>
    <section class="card"><div class="card-head"><h3>Alertes et points d’attention</h3><span class="badge ${alerts.filter(x=>x.l==='red').length?'b-red':'b-ok'}">${alerts.length}</span></div>
      ${alerts.length?`<ul class="alerts">${alerts.slice(0,8).map(x=>`<li style="--c:var(--${x.l==='red'?'red':x.l==='warn'?'warn':'ok'})"><span>${x.t}</span></li>`).join('')}</ul>`:'<p class="muted">Aucune alerte : le budget est tenu.</p>'}
      <p class="note" style="margin-top:1rem">${tip}</p></section>
  </div>
  <section class="card"><div class="card-head"><h3>Écarts prévu / réalisé</h3><div class="row noprint"><button class="btn sm" onclick="exportEcarts()">Exporter CSV</button><button class="btn sm" onclick="window.print()">Imprimer</button></div></div>
    <div class="tscroll"><table><thead><tr><th>Rubrique</th><th>Nature</th><th class="r">Prévu</th><th class="r">Réalisé</th><th class="r">Écart</th><th class="r">Taux</th><th>Statut</th></tr></thead><tbody>
    ${ecarts.map(x=>{const inc=x.c.kind==='income';const st=statusOf(x,inc);return `<tr><td><i class="dot" style="background:${x.c.color};margin-right:.45rem"></i>${esc(x.c.name)}</td><td class="muted small">${inc?'Ressource':NAT[x.c.nature].l}</td><td class="r">${fmt(x.p)}</td><td class="r">${fmt(x.r)}</td><td class="r ${(inc?x.e>=0:x.e<=0)?'up':'down'}">${fmtS(x.e)}</td><td class="r">${pc(x.t)}</td><td><span class="badge ${st[0]}">${st[1]}</span></td></tr>`}).join('')}
    </tbody></table></div></section>
  </div>`}`;
}
function statusOf(x,inc){
  if(!x.p)return['b-warn',inc?'Non prévu':'Non budgété'];
  if(inc)return x.t>=1?['b-ok','Atteint']:x.t>=.8?['b-warn','Partiel']:['b-red','Insuffisant'];
  return x.t>1?['b-red','Dépassé']:x.t===1?['b-ok','Conforme']:x.t>.9?['b-warn','Limite']:['b-ok','Maîtrisé'];
}
function buildAlerts(a,fund){
  const L=[];
  if(a.soldeR<0)L.push({l:'red',t:`Solde négatif de <strong>${fmt(-a.soldeR)}</strong> : les dépenses dépassent les ressources.`});
  if(a.soldeP<0)L.push({l:'red',t:`Le budget prévisionnel est déséquilibré de <strong>${fmt(-a.soldeP)}</strong>.`});
  D.categories.filter(c=>c.kind==='expense').forEach(c=>{const p=a.plan[c.id],r=a.real[c.id];
    if(p&&r>p)L.push({l:'red',w:r-p,t:`${esc(c.name)} : dépassement de <strong>${fmt(r-p)}</strong> (${pc(r/p)} du prévu).`});
    else if(p&&r>.9*p&&r<p)L.push({l:'warn',w:0,t:`${esc(c.name)} : ${pc(r/p)} du budget déjà consommé.`});
    else if(!p&&r>0)L.push({l:'warn',w:r,t:`${esc(c.name)} : ${fmt(r)} dépensés sans prévision.`})});
  if(a.noReceipt)L.push({l:'warn',t:`${a.noReceipt} dépense${a.noReceipt>1?'s':''} sans reçu conservé.`});
  if(fund.target&&fund.ratio<1)L.push({l:'warn',t:`Fonds d’imprévus à ${pc(fund.ratio)} de la cible (${fmt(fund.target)}).`});
  const rule=RULES[D.settings.rule];const s=rule&&rule.slices.find(x=>x.l==='Épargne');
  if(s&&a.incR&&a.savR/a.incR<s.p/100)L.push({l:'warn',t:`Épargne à ${pc(a.savR/a.incR)} des ressources, pour une cible de ${s.p}\u00A0%.`});
  return L.sort((x,y)=>(x.l==='red'?0:1)-(y.l==='red'?0:1)||(y.w||0)-(x.w||0));
}

/* ============ Graphiques ============ */
const charts={};
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function mkChart(id,cfg){if(charts[id]){charts[id].destroy();delete charts[id]}const el=document.getElementById(id);if(!el)return;
  if(!window.Chart){el.parentNode.innerHTML='<p class="muted small">Graphique indisponible (connexion à la bibliothèque impossible).</p>';return}

function drawDash(){
  if(!document.getElementById('c1'))return;

  Chart.defaults.font.family=cv('--fb');Chart.defaults.color=cv('--muted');Chart.defaults.borderColor=cv('--line');
  const y=P.year,inc=[],exp=[],sol=[],expP=[];
  for(let m=0;m<12;m++){const a=agg([y+'-'+String(m+1).padStart(2,'0')]);inc.push(a.incR);exp.push(a.expR);sol.push(a.soldeR);expP.push(a.expP)}
  const sel=new Set(periodMonths().map(x=>+x.slice(5)-1));
  const tt={callbacks:{label:c=>' '+c.dataset.label+' : '+fmt(c.raw)}};
  const alpha=(col,i)=>sel.has(i)?col:col+'55';
  mkChart('c1',{type:'bar',data:{labels:MSHORT,datasets:[
    {type:'line',label:'Solde',data:sol,borderColor:cv('--ink'),backgroundColor:cv('--ink'),pointRadius:3,tension:.3,order:0},
    {type:'line',label:'Dépenses prévues',data:expP,borderColor:cv('--gold'),borderDash:[5,4],pointRadius:0,borderWidth:2,order:1},
    {label:'Ressources',data:inc,backgroundColor:inc.map((_,i)=>alpha(hex(cv('--ok')),i)),borderRadius:5,order:2},
    {label:'Dépenses',data:exp,backgroundColor:exp.map((_,i)=>alpha(hex(cv('--accent')),i)),borderRadius:5,order:3}]},
    options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12}},tooltip:tt},
      scales:{y:{ticks:{callback:v=>NF.format(v/1000)+' k'}},x:{grid:{display:false}}}}});
  const a=agg(periodMonths());
  const rows=D.categories.filter(c=>c.kind==='expense'&&a.real[c.id]>0).map(c=>({l:c.name,v:a.real[c.id],c:c.color})).sort((x,y)=>y.v-x.v);
  const top=rows.slice(0,7),rest=rows.slice(7).reduce((s,x)=>s+x.v,0);if(rest)top.push({l:'Autres',v:rest,c:'#8C9A92'});
  mkChart('c2',{type:'doughnut',data:{labels:top.map(x=>x.l),datasets:[{data:top.map(x=>x.v),backgroundColor:top.map(x=>x.c),borderColor:cv('--surface'),borderWidth:2}]},
    options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:c=>' '+c.label+' : '+fmt(c.raw)+' ('+pc(c.raw/a.expR)+')'}}}}});
  const rule=RULES[D.settings.rule]||RULES['50/20/30'];const baseI=a.incR||a.incP||1;
  const act=rule.slices.map(s=>D.categories.filter(c=>c.kind==='expense'&&s.f(c)).reduce((t,c)=>t+a.real[c.id],0)/baseI*100);
  mkChart('c3',{type:'bar',data:{labels:rule.slices.map(s=>s.l),datasets:[
    {label:'Cible',data:rule.slices.map(s=>s.p),backgroundColor:hex(cv('--line')),borderRadius:5},
    {label:'Réel',data:act,backgroundColor:act.map((v,i)=>{const s=rule.slices[i];const over=s.l==='Épargne'?v<s.p:v>s.p;return over?cv('--accent'):cv('--brand')}),borderRadius:5}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12}},tooltip:{callbacks:{label:c=>' '+c.dataset.label+' : '+Math.round(c.raw)+' %'}}},
      scales:{x:{ticks:{callback:v=>v+' %'}},y:{grid:{display:false}}}}});
}
function hex(c){c=c.trim();if(c.startsWith('#')&&c.length===4)c='#'+[...c.slice(1)].map(x=>x+x).join('');return c.startsWith('#')?c.slice(0,7):'#888888'}

/* ============ Budget prévisionnel ============ */
function viewBudget(){
  const b=D.budgets[BM]||{};const a=agg([BM]);const rule=RULES[D.settings.rule]||RULES['50/20/30'];
  const groups=[['income',null,'Ressources'],['expense','fixe','Charges fixes'],['expense','variable','Charges variables'],['expense','occasionnelle','Dépenses occasionnelles'],['expense','imprevu','Imprévus'],['expense','epargne','Épargne et projets']];
  const rows=groups.map(([k,n,l])=>{const cs=D.categories.filter(c=>c.kind===k&&(!n||c.nature===n));if(!cs.length)return'';
    const tp=cs.reduce((s,c)=>s+(+b[c.id]||0),0),tr=cs.reduce((s,c)=>s+a.real[c.id],0);
    return `<tr class="group"><td>${l}</td><td class="r" id="gp-${k}-${n}">${fmt(tp)}</td><td class="r">${fmt(tr)}</td><td></td><td></td></tr>`+
    cs.map(c=>{const p=+b[c.id]||0,r=a.real[c.id];return `<tr><td><i class="dot" style="background:${c.color};margin-right:.45rem"></i>${esc(c.name)}${c.fund?' <span class="badge b-neu">fonds</span>':''}</td>
      <td class="r"><input class="plan-in" type="number" inputmode="numeric" min="0" step="500" value="${p||''}" placeholder="0" aria-label="Prévu ${esc(c.name)}" onchange="setPlan('${c.id}',this.value)"></td>
      <td class="r">${fmt(r)}</td><td class="r" id="be-${c.id}">${cellEcart(c,p,r)}</td><td id="bb-${c.id}">${cellBar(c,p,r)}</td></tr>`}).join('')}).join('');
  return `
  <header class="vh"><div><h1>Budget prévisionnel</h1><p class="sub">Ajuster à des recettes variables des dépenses étalées dans le temps.</p></div>
    <div class="row"><input type="month" value="${BM}" onchange="if(this.value){BM=this.value;render()}" aria-label="Mois du budget" style="width:auto">
    <button class="btn" onclick="copyPrev()">Reprendre ${esc(ml(prevYm(BM)).split(' ')[0])}</button>
    <button class="btn" onclick="copyToYear()">Étendre à l’année</button></div></header>
  <div class="stack">
  <div class="kpis" id="bsum">${budgetSummary()}</div>
  <details class="card"><summary style="cursor:pointer;font-weight:700;font-family:var(--fd)">Contrôle avec la ${rule.name.toLowerCase()}</summary>
    <p class="muted small" style="margin:.6rem 0">${rule.desc} Base : ressources prévues du mois.</p><div id="brule">${ruleTable()}</div></details>
  <section class="card"><div class="tscroll"><table><thead><tr><th>Rubrique</th><th class="r">Prévu</th><th class="r">Réalisé</th><th class="r">Écart</th><th>Consommation</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  </div>`;
}
function budgetSummary(){
  const a=agg([BM]);
  return `<div class="kpi"><span class="k">Ressources prévues</span><span class="v">${fmt(a.incP)}</span><span class="s">Réalisé ${fmt(a.incR)}</span></div>
  <div class="kpi"><span class="k">Dépenses prévues</span><span class="v">${fmt(a.expP)}</span><span class="s">Réalisé ${fmt(a.expR)}</span></div>
  <div class="kpi"><span class="k">Solde prévisionnel</span><span class="v ${a.soldeP<0?'down':'up'}">${fmtS(a.soldeP)}</span><span class="s">${a.soldeP<0?'À rééquilibrer':'Équilibré'}</span></div>
  <div class="kpi"><span class="k">Épargne prévue</span><span class="v">${pc(a.incP?a.savP/a.incP:NaN)}</span><span class="s">${fmt(a.savP)}</span></div>
  <p class="verdict small muted" style="grid-column:1/-1">${verdict(a.soldeP,true)}</p>`;
}
function ruleTable(){
  const a=agg([BM]);const rule=RULES[D.settings.rule]||RULES['50/20/30'];const base=a.incP;
  if(!base)return '<p class="muted">Saisissez d’abord les ressources prévues.</p>';
  return `<div class="tscroll"><table><thead><tr><th>Poste</th><th class="r">Cible</th><th class="r">Montant cible</th><th class="r">Prévu</th><th class="r">Écart</th></tr></thead><tbody>
  ${rule.slices.map(s=>{const pl=D.categories.filter(c=>c.kind==='expense'&&s.f(c)).reduce((t,c)=>t+a.plan[c.id],0),tg=base*s.p/100,e=pl-tg;const bad=s.l==='Épargne'?e<0:e>0;
   return `<tr><td>${s.l}${D.settings.rule==='20/20/30/30'?`<div class="muted small">${G4[s.l.slice(-1)].split(': ')[1]}</div>`:''}</td><td class="r">${s.p} %</td><td class="r">${fmt(tg)}</td><td class="r">${fmt(pl)}</td><td class="r ${bad?'down':'up'}">${fmtS(e)}</td></tr>`}).join('')}
  </tbody></table></div>`;
}
function cellEcart(c,p,r){if(!p&&!r)return '<span class="muted">—</span>';const e=r-p,good=c.kind==='income'?e>=0:e<=0;return `<span class="${good?'up':'down'}">${fmtS(e)}</span>`}
function cellBar(c,p,r){if(!p)return r?'<span class="badge b-warn">Non prévu</span>':'';const t=r/p;const col=c.kind==='income'?'var(--ok)':t>1?'var(--red)':(t>.9&&t<1)?'var(--warn)':'var(--brand)';
  return `<div class="row" style="flex-wrap:nowrap;gap:.5rem"><div class="pbarmini" style="flex:1"><i style="width:${Math.min(100,t*100)}%;background:${col}"></i></div><span class="small muted" style="min-width:40px;text-align:right">${pc(t)}</span></div>`}
function setPlan(id,v){
  const n=Math.max(0,Math.round(+v||0));D.budgets[BM]=D.budgets[BM]||{};if(n)D.budgets[BM][id]=n;else delete D.budgets[BM][id];save();
  const a=agg([BM]),c=catById(id);$('#be-'+id).innerHTML=cellEcart(c,n,a.real[id]);$('#bb-'+id).innerHTML=cellBar(c,n,a.real[id]);
  $('#bsum').innerHTML=budgetSummary();$('#brule').innerHTML=ruleTable();
  const g=document.getElementById('gp-'+c.kind+'-'+(c.kind==='income'?'null':c.nature));if(g)g.textContent=fmt(D.categories.filter(x=>x.kind===c.kind&&(c.kind==='income'||x.nature===c.nature)).reduce((s,x)=>s+(+D.budgets[BM][x.id]||0),0));
}
function copyPrev(){const p=D.budgets[prevYm(BM)];if(!p||!Object.keys(p).length){toast('Aucun budget pour '+ml(prevYm(BM)));return}
  if(D.budgets[BM]&&Object.keys(D.budgets[BM]).length&&!confirm('Remplacer le budget de '+ml(BM)+' par celui de '+ml(prevYm(BM))+' ?'))return;
  D.budgets[BM]={...p};save();render();toast('Budget repris de '+ml(prevYm(BM)))}
function copyToYear(){const src=D.budgets[BM];if(!src||!Object.keys(src).length){toast('Le budget de ce mois est vide');return}
  const y=BM.slice(0,4),m0=+BM.slice(5);if(!confirm('Appliquer ce budget aux mois suivants de '+y+' encore vides ?'))return;let n=0;
  for(let m=m0+1;m<=12;m++){const k=y+'-'+String(m).padStart(2,'0');if(!D.budgets[k]||!Object.keys(D.budgets[k]).length){D.budgets[k]={...src};n++}}
  save();toast(n+' mois complétés')}

/* ============ Journal ============ */
function viewJournal(){
  let list=D.transactions.slice();
  if(J.month)list=list.filter(t=>t.date.startsWith(J.month));
  if(J.cat)list=list.filter(t=>t.catId===J.cat);
  if(J.q){const q=J.q.toLowerCase();list=list.filter(t=>(t.label||'').toLowerCase().includes(q)||(t.who||'').toLowerCase().includes(q))}
  list.sort((a,b)=>b.date.localeCompare(a.date));
  let inc=0,exp=0;list.forEach(t=>{const c=catById(t.catId);if(!c)return;c.kind==='income'?inc+=+t.amount:exp+=+t.amount});
  return `
  <header class="vh"><div><h1>Journal des opérations</h1><p class="sub">Ressources mobilisées et dépenses exécutées, reçu à l’appui.</p></div>
    <div class="row noprint"><button class="btn" onclick="exportCSV()">Exporter CSV</button><button class="btn primary" onclick="openTx()">${I.plus}Nouvelle opération</button></div></header>
  <div class="stack">
  <div class="card"><div class="fgrid">
    <label class="f">Mois<input type="month" value="${J.month}" onchange="J.month=this.value;render()"></label>
    <label class="f">Rubrique<select onchange="J.cat=this.value;render()"><option value="">Toutes</option>${catOptions(J.cat)}</select></label>
    <label class="f">Recherche<input type="text" value="${esc(J.q)}" placeholder="Libellé ou exécutant" onchange="J.q=this.value;render()"></label>
  </div>
  <div class="row" style="margin-top:.9rem;gap:1.4rem"><span>Entrées <strong class="up">${fmt(inc)}</strong></span><span>Sorties <strong class="down">${fmt(exp)}</strong></span><span>Solde <strong>${fmtS(inc-exp)}</strong></span><span class="muted">${list.length} opération${list.length>1?'s':''}</span>${J.month?`<button class="btn sm ghost" onclick="J.month='';render()">Voir tous les mois</button>`:''}</div></div>
  <section class="card">${list.length?`<div class="tscroll"><table><thead><tr><th>Date</th><th>Libellé</th><th>Rubrique</th><th>Mode</th><th>Exécutant</th><th>Reçu</th><th class="r">Montant</th><th class="noprint"></th></tr></thead><tbody>
  ${list.map(t=>{const c=catById(t.catId)||{name:'(rubrique supprimée)',color:'#999',kind:'expense'};const [y,m,d]=t.date.split('-');
    return `<tr><td class="small">${d}/${m}/${y}</td><td>${esc(t.label||c.name)}${t.fromFund?' <span class="badge b-neu">fonds</span>':''}</td><td class="small"><i class="dot" style="background:${c.color};margin-right:.4rem"></i>${esc(c.name)}</td><td class="small muted">${esc(t.mode||'')}</td><td class="small muted">${esc(t.who||'')}</td>
    <td>${c.kind==='income'?'':t.receipt?'<span class="badge b-ok">Oui</span>':'<span class="badge b-warn">Non</span>'}</td>
    <td class="r num ${c.kind==='income'?'up':''}">${c.kind==='income'?'+':'−'}${fmt(t.amount)}</td>
    <td class="noprint" style="white-space:nowrap"><button class="icon-btn" onclick="openTx('${t.id}')" aria-label="Modifier">${I.edit}</button><button class="icon-btn" onclick="delTx('${t.id}')" aria-label="Supprimer">${I.del}</button></td></tr>`}).join('')}
  </tbody></table></div>`:`<div class="empty"><strong>Aucune opération</strong>Notez chaque entrée et chaque dépense dès qu’elle a lieu.</div>`}</section>
  </div>`;
}
function catOptions(sel,kind){
  return [['income','Ressources'],['expense','Dépenses']].filter(([k])=>!kind||k===kind).map(([k,l])=>`<optgroup label="${l}">${D.categories.filter(c=>c.kind===k).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
}
let txKind='expense';
function openTx(id){
  const t=id?D.transactions.find(x=>x.id===id):null;
  txKind=t?(catById(t.catId)||{kind:'expense'}).kind:'expense';
  const dlg=$('#dlg');
  const members=[...new Set([...(D.profile.members||[]),...D.transactions.map(x=>x.who).filter(Boolean)])];
  dlg.innerHTML=`<form onsubmit="saveTx(event,'${id||''}')">
   <div class="dlg-h"><h2 id="dlg-title">${t?'Modifier l’opération':'Nouvelle opération'}</h2><button type="button" class="icon-btn" onclick="closeDlg()" aria-label="Fermer">${I.close}</button></div>
   <div class="dlg-b">
    <div class="typeswitch" role="group"><button type="button" class="exp" aria-pressed="${txKind==='expense'}" onclick="setTxKind('expense')">Dépense</button><button type="button" class="inc" aria-pressed="${txKind==='income'}" onclick="setTxKind('income')">Ressource</button></div>
    <div class="fgrid">
     <label class="f">Montant (${esc(cur())})<input type="number" id="t-amt" min="1" step="1" inputmode="numeric" required value="${t?t.amount:''}"></label>
     <label class="f">Date<input type="date" id="t-date" required value="${t?t.date:today()}"></label>
    </div>
    <label class="f">Rubrique<select id="t-cat" required onchange="txFundToggle()">${catOptions(t&&t.catId,txKind)}</select></label>
    <label class="f">Libellé<input type="text" id="t-label" value="${esc(t?t.label:'')}" placeholder="Ex. Marché d’Adjamé, facture CIE…"></label>
    <div class="fgrid">
     <label class="f">Mode de paiement<select id="t-mode">${MODES.map(m=>`<option ${t&&t.mode===m?'selected':''}>${m}</option>`).join('')}</select></label>
     <label class="f">Exécutant<input type="text" id="t-who" list="whos" value="${esc(t?t.who:(CLOUD&&ME?ME.name:(D.profile.members||[])[0]||''))}"><datalist id="whos">${members.map(m=>`<option value="${esc(m)}">`).join('')}</datalist></label>
    </div>
    <label class="check" id="t-rec-w"><input type="checkbox" id="t-rec" ${!t||t.receipt?'checked':''}> Reçu conservé</label>
    <label class="check" id="t-fund-w"><input type="checkbox" id="t-fund" ${t&&t.fromFund?'checked':''}> Payé avec le fonds d’imprévus</label>
   </div>
   <div class="dlg-f">${t?`<button type="button" class="btn danger" onclick="delTx('${t.id}')">Supprimer</button>`:''}<button type="button" class="btn" onclick="closeDlg()">Annuler</button><button class="btn primary" type="submit">${t?'Enregistrer':'Ajouter l’opération'}</button></div>
  </form>`;
  dlg.showModal();txFundToggle();setTimeout(()=>$('#t-amt').focus(),30);
}
function setTxKind(k){txKind=k;$$btn('.typeswitch button').forEach(b=>b.setAttribute('aria-pressed',b.classList.contains(k==='expense'?'exp':'inc')));$('#t-cat').innerHTML=catOptions('',k);txFundToggle()}
function $$btn(s){return[...document.querySelectorAll(s)]}
function txFundToggle(){const c=catById($('#t-cat').value);$('#t-fund-w').classList.toggle('hidden',!(c&&c.nature==='imprevu'));$('#t-rec-w').classList.toggle('hidden',txKind==='income')}
function saveTx(e,id){
  e.preventDefault();const amt=Math.round(+$('#t-amt').value);if(!(amt>0)){toast('Indiquez un montant positif');return}
  const c=catById($('#t-cat').value);
  const t={id:id||uid(),date:$('#t-date').value,catId:c.id,amount:amt,label:$('#t-label').value.trim(),mode:$('#t-mode').value,who:$('#t-who').value.trim(),receipt:c.kind==='income'?true:$('#t-rec').checked,fromFund:c.nature==='imprevu'&&$('#t-fund').checked};
  if(id){const i=D.transactions.findIndex(x=>x.id===id);D.transactions[i]=t}else D.transactions.push(t);
  if(t.who&&!(D.profile.members||[]).includes(t.who))(D.profile.members=D.profile.members||[]).push(t.who);
  save();closeDlg();render();toast(id?'Opération enregistrée':'Opération ajoutée');
  const b=(D.budgets[t.date.slice(0,7)]||{})[c.id];
  if(c.kind==='expense'&&b){const used=agg([t.date.slice(0,7)]).real[c.id];if(used>b)setTimeout(()=>toast('Attention : '+c.name+' dépasse son budget de '+fmt(used-b)),900)}
}
function delTx(id){if(!confirm('Supprimer cette opération ?'))return;D.transactions=D.transactions.filter(x=>x.id!==id);save();closeDlg();render();toast('Opération supprimée')}
function closeDlg(){const d=$('#dlg');if(d.open)d.close()}

/* ============ Objectifs & imprévus ============ */
function viewGoals(){
  const f=fundState();
  const goals=D.goals.map(g=>{const left=Math.max(0,g.target-g.saved);const[y,m]=(g.deadline||'').split('-').map(Number);
    const months=y?Math.max(1,(y-NOW.getFullYear())*12+(m-1-NOW.getMonth())+1):NaN;return{...g,left,months,monthly:left/months,ratio:g.target?g.saved/g.target:0}});
  return `
  <header class="vh"><div><h1>Objectifs et imprévus</h1><p class="sub">Des objectifs réalistes, précis, mesurables et datés.</p></div><button class="btn primary" onclick="openGoal()">${I.plus}Nouvel objectif</button></header>
  <div class="stack">
  <section class="card"><div class="card-head"><h3>Fonds d’imprévus</h3><span class="badge ${f.ratio>=1?'b-ok':f.ratio>=.5?'b-warn':'b-red'}">${pc(f.ratio)}</span></div>
    <div class="grid3" style="margin-bottom:1rem">
      <div><p class="muted small">Disponible</p><p class="num" style="font-size:1.5rem">${fmt(f.bal)}</p></div>
      <div><p class="muted small">Cible (${D.settings.fundMonths} mois de besoins)</p><p class="num" style="font-size:1.5rem">${fmt(f.target)}</p></div>
      <div><p class="muted small">Besoins mensuels prévus</p><p class="num" style="font-size:1.5rem">${fmt(f.ess)}</p></div>
    </div>
    <div class="bigbar"><i style="width:${Math.min(100,f.ratio*100)}%"></i></div>
    <p class="muted small" style="margin-top:.7rem">Personne n’est à l’abri des accidents de la vie. Le fonds est alimenté par la rubrique « Fonds d’imprévus » et diminue quand un imprévu est payé avec lui.</p>
    <div class="row" style="margin-top:.8rem"><button class="btn" onclick="fundDeposit()">Alimenter le fonds</button></div>
  </section>
  ${goals.length?`<div class="grid2">${goals.map(g=>`<section class="card goal">
    <div class="top"><h3 style="margin:0">${esc(g.name)}</h3><div style="white-space:nowrap"><button class="icon-btn" onclick="openGoal('${g.id}')" aria-label="Modifier">${I.edit}</button><button class="icon-btn" onclick="delGoal('${g.id}')" aria-label="Supprimer">${I.del}</button></div></div>
    <p><span class="num" style="font-size:1.35rem">${fmt(g.saved)}</span> <span class="muted">sur ${fmt(g.target)}</span></p>
    <div class="bigbar"><i style="width:${Math.min(100,g.ratio*100)}%"></i></div>
    <p class="small muted">${g.left?`Reste ${fmt(g.left)}${isFinite(g.months)?` en ${g.months} mois, soit <strong style="color:var(--ink)">${fmt(g.monthly)} par mois</strong> (échéance ${esc(ml(g.deadline))})`:''}.`:'<strong class="up">Objectif atteint.</strong>'}</p>
    <div class="row"><button class="btn sm" onclick="goalDeposit('${g.id}')">Ajouter un versement</button></div></section>`).join('')}</div>`:
    `<div class="card empty"><strong>Aucun objectif</strong>Construction, études des enfants, véhicule : donnez un montant et une échéance à chaque projet.</div>`}
  </div>`;
}
function openGoal(id){
  const g=id?D.goals.find(x=>x.id===id):null;const dlg=$('#dlg');
  dlg.innerHTML=`<form onsubmit="saveGoal(event,'${id||''}')"><div class="dlg-h"><h2 id="dlg-title">${g?'Modifier l’objectif':'Nouvel objectif'}</h2><button type="button" class="icon-btn" onclick="closeDlg()" aria-label="Fermer">${I.close}</button></div>
   <div class="dlg-b"><label class="f">Intitulé<input type="text" id="g-name" required value="${esc(g?g.name:'')}" placeholder="Ex. Achat d’un terrain"></label>
   <div class="fgrid"><label class="f">Montant visé<input type="number" id="g-target" min="1" required value="${g?g.target:''}"></label><label class="f">Déjà épargné<input type="number" id="g-saved" min="0" value="${g?g.saved:0}"></label></div>
   <label class="f">Échéance<input type="month" id="g-deadline" required value="${g?g.deadline:''}"></label></div>
   <div class="dlg-f"><button type="button" class="btn" onclick="closeDlg()">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`;
  dlg.showModal();
}
function saveGoal(e,id){e.preventDefault();const g={id:id||uid(),name:$('#g-name').value.trim(),target:Math.round(+$('#g-target').value),saved:Math.round(+$('#g-saved').value||0),deadline:$('#g-deadline').value};
  if(id)D.goals[D.goals.findIndex(x=>x.id===id)]=g;else D.goals.push(g);save();closeDlg();render();toast('Objectif enregistré')}
function delGoal(id){if(!confirm('Supprimer cet objectif ?'))return;D.goals=D.goals.filter(x=>x.id!==id);save();render()}
function goalDeposit(id){const v=Math.round(+prompt('Montant du versement ('+cur()+')')||0);if(!(v>0))return;
  const g=D.goals.find(x=>x.id===id);g.saved+=v;
  const inv=D.categories.find(c=>c.name==='Investissement / projet');
  if(inv&&confirm('Enregistrer aussi ce versement au journal (rubrique « '+inv.name+' ») ?'))D.transactions.push({id:uid(),date:today(),catId:inv.id,amount:v,label:'Versement : '+g.name,mode:'Virement',who:(D.profile.members||[])[0]||'',receipt:true,fromFund:false});
  save();render();toast('Versement ajouté')}
function fundDeposit(){const fc=D.categories.find(c=>c.fund);if(!fc){toast('Aucune rubrique marquée « fonds d’imprévus »');return}openTx();setTimeout(()=>{$('#t-cat').value=fc.id;$('#t-label').value='Alimentation du fonds d’imprévus';txFundToggle()},0)}

/* ============ Rubriques ============ */
function viewCats(){
  const block=(k,l)=>`<section class="card"><div class="card-head"><h3>${l}</h3><button class="btn sm" onclick="openCat(null,'${k}')">${I.plus}Ajouter</button></div><ul class="catlist">
  ${D.categories.filter(c=>c.kind===k).map(c=>{const n=D.transactions.filter(t=>t.catId===c.id).length;return `<li><span class="swatch" style="background:${c.color}"></span><div class="n"><div>${esc(c.name)}</div><div class="small muted">${k==='income'?INAT[c.nature]:NAT[c.nature].l+' · '+BUCK[c.bucket]+' · Charge '+c.g4}${c.fund?' · fonds d’imprévus':''}${n?' · '+n+' opération'+(n>1?'s':''):''}</div></div>
   <button class="icon-btn" onclick="openCat('${c.id}')" aria-label="Modifier">${I.edit}</button><button class="icon-btn" onclick="delCat('${c.id}')" aria-label="Supprimer">${I.del}</button></li>`}).join('')}</ul></section>`;
  return `<header class="vh"><div><h1>Rubriques</h1><p class="sub">Les postes de ressources et de dépenses de votre foyer. La nature et la classe servent aux règles de répartition.</p></div>

  <div class="grid2" style="align-items:start">${block('income','Ressources')}${block('expense','Dépenses')}</div>`;
}
function openCat(id,kind){
  const c=id?catById(id):{kind,nature:kind==='income'?'fixe':'variable',bucket:'besoins',g4:3,color:PALETTE[D.categories.length%PALETTE.length],name:'',fund:false};
  const K=c.kind;const dlg=$('#dlg');
  dlg.innerHTML=`<form onsubmit="saveCat(event,'${id||''}','${K}')"><div class="dlg-h"><h2 id="dlg-title">${id?'Modifier la rubrique':'Nouvelle rubrique'} (${K==='income'?'ressource':'dépense'})</h2><button type="button" class="icon-btn" onclick="closeDlg()" aria-label="Fermer">${I.close}</button></div>
   <div class="dlg-b"><label class="f">Nom<input type="text" id="c-name" required value="${esc(c.name)}"></label>
   <div class="fgrid"><label class="f">Nature<select id="c-nat">${Object.entries(K==='income'?INAT:Object.fromEntries(Object.entries(NAT).map(([k,v])=>[k,v.l]))).map(([k,v])=>`<option value="${k}" ${c.nature===k?'selected':''}>${v}</option>`).join('')}</select></label>
   <label class="f">Couleur<input type="color" id="c-col" value="${c.color}" style="width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)"></label></div>
   ${K==='expense'?`<div class="fgrid"><label class="f">Type (règle 50/20/30)<select id="c-buck">${Object.entries(BUCK).map(([k,v])=>`<option value="${k}" ${c.bucket===k?'selected':''}>${v}</option>`).join('')}</select></label>
   <label class="f">Classe (règle 20/20/30/30)<select id="c-g4">${Object.entries(G4).map(([k,v])=>`<option value="${k}" ${+c.g4===+k?'selected':''}>${v.split(' : ')[0]}</option>`).join('')}</select></label></div>
   <label class="check"><input type="checkbox" id="c-fund" ${c.fund?'checked':''}> Cette rubrique alimente le fonds d’imprévus</label>`:''}</div>
   <div class="dlg-f"><button type="button" class="btn" onclick="closeDlg()">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`;
  dlg.showModal();
}
function saveCat(e,id,K){e.preventDefault();
  const c={id:id||uid(),kind:K,name:$('#c-name').value.trim(),nature:$('#c-nat').value,color:$('#c-col').value,bucket:K==='expense'?$('#c-buck').value:null,g4:K==='expense'?+$('#c-g4').value:null,fund:K==='expense'&&$('#c-fund').checked};
  if(id)D.categories[D.categories.findIndex(x=>x.id===id)]=c;else D.categories.push(c);save();closeDlg();render();toast('Rubrique enregistrée')}
function delCat(id){const n=D.transactions.filter(t=>t.catId===id).length;
  if(n){toast('Impossible : '+n+' opération(s) utilisent cette rubrique');return}
  if(!confirm('Supprimer cette rubrique ?'))return;D.categories=D.categories.filter(c=>c.id!==id);Object.values(D.budgets).forEach(b=>delete b[id]);save();render()}
function resetCats(){if(!confirm('Ajouter les rubriques par défaut manquantes ?'))return;const names=new Set(D.categories.map(c=>c.name));defaultCats().forEach(c=>{if(!names.has(c.name))D.categories.push(c)});save();render();toast('Rubriques complétées')}

/* ============ Méthode (guide DGTCP) ============ */

/* ============ Paramètres ============ */
