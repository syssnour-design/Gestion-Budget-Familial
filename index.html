/* ============ Synchronisation familiale (Supabase) ============ */
// Pour activer le partage en ligne, renseignez ces deux valeurs (Supabase > Project Settings > API).
// Laissées vides, l'application propose de les saisir depuis l'écran de connexion ou les Réglages.
const SUPABASE_URL='';
const SUPABASE_ANON_KEY='';
const CLIENT=uid()+uid();
let CLOUD=false,SB=null,ME=null,HH=null,MEMBERS=[],LAST=new Map(),PULLED=null,CHAN=null,SYNC='ok',syncBusy=false,syncAgain=false,cloudAuthTab='login';
function sbConfig(){if(SUPABASE_URL&&SUPABASE_ANON_KEY)return{url:SUPABASE_URL,key:SUPABASE_ANON_KEY,fixed:true};const c=store.get('bf_sb_config');return c&&c.url&&c.key?c:null}
const stable=v=>Array.isArray(v)?'['+v.map(x=>stable(x===undefined?null:x)).join(',')+']':(v&&typeof v==='object')?'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}':JSON.stringify(v===undefined?null:v);
const byOrd=(a,b)=>(a.ord??1e9)-(b.ord??1e9);
const SYNCL={ok:['b-ok','Synchronisé'],sync:['b-neu','Synchronisation…'],off:['b-warn','Hors ligne, en attente']};
function syncBadge(){if(!CLOUD)return '';const s=SYNCL[SYNC];return `<span class="badge ${s[0]} syncst" role="status">${s[1]}</span>`}
function setSync(s){SYNC=s;document.querySelectorAll('.syncst').forEach(el=>{el.className='badge '+SYNCL[s][0]+' syncst';el.textContent=SYNCL[s][1]})}
function cloudErr(e){const m=String((e&&(e.message||e.error_description||e.msg))||e||'');
  if(/Invalid login/i.test(m))return 'E-mail ou mot de passe incorrect.';
  if(/not confirmed/i.test(m))return 'Adresse e-mail non confirmée : ouvrez le lien reçu par e-mail, puis reconnectez-vous.';
  if(/already registered|already exists/i.test(m))return 'Un compte existe déjà avec cet e-mail.';
  if(/Password should|weak/i.test(m))return 'Mot de passe trop faible : 8 caractères minimum.';
  if(/rate limit|too many/i.test(m))return 'Trop de tentatives. Réessayez dans quelques minutes.';
  if(/Code d.invitation/i.test(m))return 'Code d’invitation inconnu. Vérifiez-le auprès du membre qui vous l’a envoyé.';
  if(/fetch|network|Load failed|NetworkError|CSP|Content Security/i.test(m))return 'Serveur injoignable. Vérifiez la connexion internet et la configuration de synchronisation.';
  return m||'Une erreur est survenue.'}
function busy(e){const b=e.submitter||e.target.querySelector('[type=submit]');if(b){b.disabled=true;b.dataset.t=b.textContent;b.textContent='Patientez…'}return b}
function unbusy(b){if(b){b.disabled=false;b.textContent=b.dataset.t||b.textContent}}

/* --- Conversion état <-> éléments synchronisés --- */
function itemsOf(d){const m=new Map(),put=(k,v)=>m.set(k,stable(v));
  const st={...d.settings};delete st.theme;put('meta|main',{profile:d.profile,settings:st});
  d.categories.forEach((c,i)=>put('cat|'+c.id,{...c,ord:i}));
  d.transactions.forEach(t=>put('tx|'+t.id,t));
  d.goals.forEach((g,i)=>put('goal|'+g.id,{...g,ord:i}));
  for(const mo in d.budgets)for(const c in d.budgets[mo])put('budget|'+mo+'|'+c,{amount:+d.budgets[mo][c]});
  return m}
function patchInto(d,kind,id,data){
  if(kind==='meta'){if(data){d.profile=Object.assign({},d.profile,data.profile||{});const th=d.settings.theme;d.settings=Object.assign({},d.settings,data.settings||{});d.settings.theme=th}return}
  if(kind==='budget'){const i=id.indexOf('|'),mo=id.slice(0,i),c=id.slice(i+1);if(data){(d.budgets[mo]=d.budgets[mo]||{})[c]=+data.amount}else if(d.budgets[mo])delete d.budgets[mo][c];return}
  const arr={cat:'categories',tx:'transactions',goal:'goals'}[kind];if(!arr)return;
  const list=d[arr],i=list.findIndex(x=>x.id===id);
  if(!data){if(i>=0)list.splice(i,1);return}
  const v=JSON.parse(JSON.stringify(data));v.id=id;if(i>=0)list[i]=v;else list.push(v)}
function emptyData(){return{v:1,profile:{name:ME.name,household:HH?HH.name:'Mon foyer',members:[]},settings:{currency:'FCFA',rule:'50/20/30',fundMonths:3,theme:store.get('bf_theme')||'auto'},categories:[],budgets:{},transactions:[],goals:[]}}
function bump(ts){if(ts&&(!PULLED||ts>PULLED))PULLED=ts}
const sinceOf=p=>p?new Date(Date.parse(p)-60000).toISOString():null;
function applyRows(rows){let n=0;rows.forEach(r=>{bump(r.updated_at);const k=r.kind+'|'+r.id;
    if(r.deleted){if(!LAST.has(k))return;LAST.delete(k);patchInto(D,r.kind,r.id,null);n++}
    else{const s=stable(r.data);if(LAST.get(k)===s)return;LAST.set(k,s);patchInto(D,r.kind,r.id,r.data);n++}});
  if(n){D.categories.sort(byOrd);D.goals.sort(byOrd)}cloudCache();return n}
async function pullRows(since){let all=[],from=0;
  for(;;){let q=SB.from('items').select('kind,id,data,deleted,updated_at,updated_by,origin').eq('household_id',HH.id);
    q=since?q.gt('updated_at',since):q.eq('deleted',false);
    const{data,error}=await q.order('updated_at',{ascending:true}).range(from,from+999);
    if(error)throw error;all=all.concat(data||[]);if(!data||data.length<1000)break;from+=1000}
  return all}
function pendingKeys(){const now=itemsOf(D),up=[],del=[];now.forEach((v,k)=>{if(LAST.get(k)!==v)up.push(k)});LAST.forEach((v,k)=>{if(!now.has(k))del.push(k)});return{now,up,del}}
function pendingCount(){if(!CLOUD||!D||!HH)return 0;const p=pendingKeys();return p.up.length+p.del.length}
function mkRow(k,v,deleted){const i=k.indexOf('|');return{household_id:HH.id,kind:k.slice(0,i),id:k.slice(i+1),data:JSON.parse(v),deleted,origin:CLIENT}}
async function cloudSave(){
  if(!CLOUD||!HH||!D)return;if(syncBusy){syncAgain=true;return}syncBusy=true;
  try{const{now,up,del}=pendingKeys();
    if(up.length||del.length){setSync('sync');
      const rows=up.map(k=>mkRow(k,now.get(k),false)).concat(del.map(k=>mkRow(k,LAST.get(k),true)));
      for(let i=0;i<rows.length;i+=400){const ch=rows.slice(i,i+400);
        const{error}=await SB.from('items').upsert(ch,{onConflict:'household_id,kind,id'});if(error)throw error;
        ch.forEach(r=>{const k=r.kind+'|'+r.id;if(r.deleted)LAST.delete(k);else LAST.set(k,stable(r.data))})}
      cloudCache()}
    setSync('ok')}
  catch(e){console.warn('Synchronisation',e);setSync('off')}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;cloudSave()}}}
let ccT=null;
function cloudCache(){clearTimeout(ccT);ccT=setTimeout(()=>{if(HH&&D)store.set('bf_cc_'+HH.id,{D,last:[...LAST],pulled:PULLED})},250)}
let rT=null;
function scheduleRender(){clearTimeout(rT);rT=setTimeout(()=>{const a=document.activeElement;
  if($('#dlg').open||(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.closest('#main'))){scheduleRender();return}if(D)render()},500)}
let rnT=null;
function remoteNote(u){clearTimeout(rnT);rnT=setTimeout(()=>{const m=MEMBERS.find(x=>x.user_id===u);toast(m&&m.user_id!==ME.id?'Mise à jour reçue de '+(m.display_name||'un membre'):'Données du foyer mises à jour')},1200)}
function subscribe(){if(CHAN){try{SB.removeChannel(CHAN)}catch(e){}CHAN=null}
  CHAN=SB.channel('hh-'+HH.id).on('postgres_changes',{event:'*',schema:'public',table:'items',filter:'household_id=eq.'+HH.id},p=>{
    const r=p&&p.new;if(!r||!r.kind||r.origin===CLIENT)return;if(applyRows([r])){remoteNote(r.updated_by);scheduleRender()}})
  .subscribe(s=>{if(s==='SUBSCRIBED')refreshCloud()})}
async function refreshCloud(){if(!CLOUD||!HH||!D)return;
  try{const rows=await pullRows(sinceOf(PULLED));if(applyRows(rows))scheduleRender();await cloudSave()}catch(e){setSync('off')}}
async function loadMembers(){const{data,error}=await SB.from('household_members').select('user_id,display_name,role').eq('household_id',HH.id);
  if(!error&&data){MEMBERS=data;const me=data.find(m=>m.user_id===ME.id);if(me)HH.role=me.role}}
function mergeMembers(){const names=MEMBERS.map(m=>m.display_name).filter(Boolean);const cur=D.profile.members||[];
  const add=names.filter(n=>!cur.includes(n));if(add.length)D.profile.members=cur.concat(add)}

/* --- Démarrage et authentification en ligne --- */
async function cloudBoot(cfg){
  const lib=window.__SBMOCK||window.supabase;
  if(!lib||!lib.createClient){localBoot();toast('Synchronisation indisponible (bibliothèque non chargée) : mode local');return}
  CLOUD=true;SB=lib.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(openRecovery,400)});
  let s=null;try{s=(await SB.auth.getSession()).data.session}catch(e){}
  if(s)await afterLogin(s.user);else renderAuth();
}
async function afterLogin(user){
  ME={id:user.id,email:user.email,name:(user.user_metadata&&user.user_metadata.name)||String(user.email).split('@')[0]};
  U={id:ME.id,name:ME.name,email:ME.email};
  const cached=store.get('bf_hh_'+ME.id);let rows;
  try{const r=await SB.from('household_members').select('household_id,role,households(id,name,invite_code)').eq('user_id',ME.id);if(r.error)throw r.error;rows=r.data||[]}
  catch(e){if(cached&&store.get('bf_cc_'+cached.id)){HH=cached;setSync('off');return openHousehold()}return renderCloudAuth(cloudErr(e))}
  if(!rows.length){store.del('bf_hh_'+ME.id);return renderHousehold()}
  const m=(cached&&rows.find(x=>x.household_id===cached.id))||rows[0];
  HH={id:m.household_id,name:m.households?m.households.name:'Mon foyer',invite_code:m.households?m.households.invite_code:'',role:m.role};
  store.set('bf_hh_'+ME.id,HH);return openHousehold();
}
async function openHousehold(){
  const c=store.get('bf_cc_'+HH.id);
  if(c&&c.D){D=c.D;LAST=new Map(c.last||[]);PULLED=c.pulled||null;D.settings.theme=store.get('bf_theme')||'auto';applyTheme();VIEW='dash';render()}
  else{D=null;LAST=new Map();PULLED=null;$('#root').innerHTML='<div class="auth-panel" style="min-height:100%"><p class="muted">Chargement des données du foyer…</p></div>'}
  try{setSync('sync');await loadMembers();
    if(D){applyRows(await pullRows(sinceOf(PULLED)))}
    else{const rows=await pullRows(null);D=emptyData();applyRows(rows);
      if(!D.categories.length&&HH.role==='admin')D.categories=defaultCats()}
    mergeMembers();applyTheme();render();subscribe();await cloudSave();
  }catch(e){setSync('off');if(!D)renderCloudAuth(cloudErr(e))}
}
function renderCloudAuth(msg,ok){
  document.documentElement.removeAttribute('data-theme');const t=cloudAuthTab,cfg=sbConfig();
  const m=`<p class="err" id="a-err" style="${ok?'color:var(--ok)':''}">${esc(msg||'')}</p>`;
  $('#root').innerHTML=`<div class="auth">${authBrand()}<section class="auth-panel"><div class="auth-card">
   ${t!=='forgot'?`<div class="tabs" role="tablist"><button role="tab" aria-selected="${t==='login'}" onclick="cloudAuthTab='login';renderCloudAuth()">Se connecter</button><button role="tab" aria-selected="${t==='signup'}" onclick="cloudAuthTab='signup';renderCloudAuth()">Créer un compte</button></div>`:''}
   ${t==='login'?`<form class="stack" onsubmit="cloudLogin(event)"><h2>Bon retour</h2>
     <label class="f">Adresse e-mail<input type="email" id="a-email" required autocomplete="email"></label>
     <label class="f">Mot de passe<input type="password" id="a-pass" required autocomplete="current-password"></label>${m}
     <button class="btn primary" type="submit" style="justify-content:center">Se connecter</button>
     <button type="button" class="btn ghost" style="justify-content:center" onclick="cloudAuthTab='forgot';renderCloudAuth()">Mot de passe oublié ?</button></form>`
   :t==='signup'?`<form class="stack" onsubmit="cloudSignup(event)"><h2>Créer votre compte</h2>
     <p class="muted small">Chaque membre du foyer crée son propre compte, puis rejoint le foyer avec le code d’invitation.</p>
     <label class="f">Votre nom<input type="text" id="s-name" required autocomplete="name"></label>
     <label class="f">Adresse e-mail<input type="email" id="s-email" required autocomplete="email"></label>
     <label class="f">Mot de passe <span class="h">8 caractères minimum</span><input type="password" id="s-pass" required minlength="8" autocomplete="new-password"></label>${m}
     <button class="btn primary" type="submit" style="justify-content:center">Créer le compte</button></form>`
   :`<form class="stack" onsubmit="cloudForgot(event)"><h2>Mot de passe oublié</h2><p class="muted">Recevez un lien de réinitialisation par e-mail.</p>
     <label class="f">Adresse e-mail<input type="email" id="f-email" required autocomplete="email"></label>${m}
     <button class="btn primary" type="submit" style="justify-content:center">Envoyer le lien</button>
     <button type="button" class="btn ghost" style="justify-content:center" onclick="cloudAuthTab='login';renderCloudAuth()">Retour à la connexion</button></form>`}
   <p class="note">Synchronisation familiale active : le budget du foyer est partagé entre les téléphones de ses membres et reste consultable hors connexion.</p>
   ${cfg&&!cfg.fixed?'<button class="btn ghost sm" onclick="disableSync()">Revenir au mode local sur cet appareil</button>':''}
  </div></section></div>`;
}
function authErr(msg,b){unbusy(b);const el=$('#a-err');if(el){el.style.color='';el.textContent=msg}}
async function cloudLogin(e){e.preventDefault();const b=busy(e);
  try{const{data,error}=await SB.auth.signInWithPassword({email:$('#a-email').value.trim(),password:$('#a-pass').value});
    if(error)return authErr(cloudErr(error),b);await afterLogin(data.user)}catch(err){authErr(cloudErr(err),b)}}
async function cloudSignup(e){e.preventDefault();const b=busy(e);const name=$('#s-name').value.trim();
  try{const{data,error}=await SB.auth.signUp({email:$('#s-email').value.trim(),password:$('#s-pass').value,options:{data:{name},emailRedirectTo:location.href.split('#')[0]}});
    if(error)return authErr(cloudErr(error),b);
    if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)return authErr('Un compte existe déjà avec cet e-mail.',b);
    if(data.session)return afterLogin(data.user);
    cloudAuthTab='login';renderCloudAuth('Compte créé. Confirmez votre adresse avec le lien reçu par e-mail, puis connectez-vous.',true)}catch(err){authErr(cloudErr(err),b)}}
async function cloudForgot(e){e.preventDefault();const b=busy(e);
  try{const{error}=await SB.auth.resetPasswordForEmail($('#f-email').value.trim(),{redirectTo:location.href.split('#')[0]});
    if(error)return authErr(cloudErr(error),b);cloudAuthTab='login';renderCloudAuth('Lien envoyé. Ouvrez l’e-mail reçu pour choisir un nouveau mot de passe.',true)}catch(err){authErr(cloudErr(err),b)}}
function openRecovery(){const dlg=$('#dlg');
  dlg.innerHTML=`<form onsubmit="saveRecovery(event)"><div class="dlg-h"><h2 id="dlg-title">Nouveau mot de passe</h2></div>
   <div class="dlg-b"><label class="f">Nouveau mot de passe <span class="h">8 caractères minimum</span><input type="password" id="r-pass" minlength="8" required autocomplete="new-password"></label></div>
   <div class="dlg-f"><button class="btn primary" type="submit">Enregistrer le mot de passe</button></div></form>`;dlg.showModal()}
async function saveRecovery(e){e.preventDefault();const b=busy(e);const{error}=await SB.auth.updateUser({password:$('#r-pass').value});
  if(error){unbusy(b);toast(cloudErr(error));return}closeDlg();toast('Mot de passe modifié')}
function localImportOptions(){const l=users().filter(u=>store.get('bf_data_'+u.id));if(!l.length)return '';
  return `<label class="f">Reprendre des données existantes sur ce téléphone<select id="h-import"><option value="">Non, partir de zéro</option>${l.map(u=>`<option value="${u.id}">Compte local de ${esc(u.name)} (${esc(u.email)})</option>`).join('')}</select></label>`}
function renderHousehold(msg){
  $('#root').innerHTML=`<div class="auth">${authBrand()}<section class="auth-panel"><div class="auth-card">
   <div><h2>Votre foyer</h2><p class="muted" style="margin-top:.4rem">Bonjour ${esc(ME.name)}. Rejoignez le foyer d’un membre de votre famille avec son code d’invitation, ou créez-en un.</p></div>
   <form class="card stack" onsubmit="joinHousehold(event)"><h3 style="margin:0">Rejoindre un foyer</h3>
     <label class="f">Code d’invitation<input type="text" id="h-code" required maxlength="12" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em" placeholder="Ex. 7F3A9C21"></label>
     <button class="btn primary" type="submit" style="justify-content:center">Rejoindre le foyer</button></form>
   <form class="card stack" onsubmit="createHousehold(event)"><h3 style="margin:0">Créer un nouveau foyer</h3>
     <label class="f">Nom du foyer<input type="text" id="h-name" required value="Famille ${esc(ME.name.split(' ').slice(-1)[0])}"></label>
     <label class="f">Règle de répartition<select id="h-rule">${Object.entries(RULES).map(([k,r])=>`<option value="${k}">${r.name}</option>`).join('')}</select></label>
     ${localImportOptions()}
     <label class="check"><input type="checkbox" id="h-demo"> Démarrer avec des données d’exemple</label>
     <button class="btn" type="submit" style="justify-content:center">Créer le foyer</button></form>
   <p class="err" id="h-err">${esc(msg||'')}</p>
   <button class="btn ghost sm" onclick="logout()">Se déconnecter</button>
  </div></section></div>`}
async function createHousehold(e){e.preventDefault();const b=busy(e);
  const name=$('#h-name').value.trim(),rule=$('#h-rule').value,demo=$('#h-demo').checked,imp=$('#h-import')?$('#h-import').value:'';
  const{data,error}=await SB.rpc('create_household',{p_name:name,p_display:ME.name});
  if(error){unbusy(b);$('#h-err').textContent=cloudErr(error);return}
  const h=Array.isArray(data)?data[0]:data;HH={id:h.id,name:h.name,invite_code:h.invite_code,role:'admin'};store.set('bf_hh_'+ME.id,HH);
  let d=imp?store.get('bf_data_'+imp):null;
  if(d){d=JSON.parse(JSON.stringify(d));d.profile.household=name}else{d=newData({name:ME.name,household:name,rule});if(demo)seedDemo(d)}
  d.settings=Object.assign({currency:'FCFA',rule,fundMonths:3},d.settings);d.settings.theme=store.get('bf_theme')||'auto';
  D=d;LAST=new Map();PULLED=null;await loadMembers();mergeMembers();applyTheme();VIEW='dash';render();subscribe();await cloudSave();
  toast('Foyer créé. Invitez votre famille depuis Réglages.')}
async function joinHousehold(e){e.preventDefault();const b=busy(e);
  const{error}=await SB.rpc('join_household',{p_code:$('#h-code').value.trim().toUpperCase(),p_display:ME.name});
  if(error){unbusy(b);$('#h-err').textContent=cloudErr(error);return}
  await afterLogin({id:ME.id,email:ME.email,user_metadata:{name:ME.name}});toast('Vous avez rejoint le foyer')}
async function cloudLogout(){const n=pendingCount();
  if(n&&!confirm(n+' modification(s) ne sont pas encore synchronisées et seront perdues. Se déconnecter quand même ?'))return;
  if(CHAN){try{SB.removeChannel(CHAN)}catch(e){}CHAN=null}
  try{await SB.auth.signOut()}catch(e){}
  if(HH)store.del('bf_cc_'+HH.id);if(ME)store.del('bf_hh_'+ME.id);
  ME=null;U=null;D=null;HH=null;LAST=new Map();MEMBERS=[];PULLED=null;setSync('ok');Object.values(charts).forEach(c=>c.destroy());cloudAuthTab='login';renderAuth()}

/* --- Réglages du foyer partagé --- */
function cloudSettingsHtml(){const admin=HH.role==='admin';
  return `<section class="card stack"><div class="card-head" style="margin:0"><h3>Foyer partagé</h3>${syncBadge()}</div>
    <p class="muted small">Chaque membre crée son compte sur l’application, puis saisit ce code à sa première connexion. Les opérations saisies sur un téléphone apparaissent sur les autres en quelques secondes.</p>
    <p class="num" style="font-size:2rem;letter-spacing:.14em">${esc(HH.invite_code||'—')}</p>
    <div class="row"><button class="btn" onclick="shareCode()">Envoyer l’invitation</button><button class="btn" onclick="copyCode()">Copier le code</button>${admin?'<button class="btn ghost" onclick="regenCode()">Changer le code</button>':''}</div>
    <ul class="catlist">${MEMBERS.map(m=>`<li><div class="n"><div>${esc(m.display_name||'Membre')}${m.user_id===ME.id?' (vous)':''}</div><div class="small muted">${m.role==='admin'?'Administrateur':'Membre'}</div></div>${admin&&m.user_id!==ME.id?`<button class="btn sm danger" onclick="removeMember('${m.user_id}')">Retirer</button>`:''}</li>`).join('')}</ul>
    <div class="row"><button class="btn" onclick="syncNow()">Synchroniser maintenant</button><button class="btn danger" onclick="leaveHousehold()">Quitter le foyer</button></div></section>
  <section class="card stack"><h3 style="margin:0">Compte</h3>
    <p class="small">${esc(ME.name)}, ${esc(ME.email)}</p>
    <label class="f">Nouveau mot de passe<input type="password" id="pw-new" minlength="8" autocomplete="new-password"></label>
    <div class="row"><button class="btn" onclick="changePw()">Changer le mot de passe</button><button class="btn" onclick="logout()">Se déconnecter</button></div></section>`}
function inviteText(){return 'Rejoins notre budget familial « '+D.profile.household+' » sur BudgetFoyer : '+location.href.split('#')[0]+' . Crée ton compte puis saisis le code du foyer : '+HH.invite_code}
async function copyCode(){try{await navigator.clipboard.writeText(HH.invite_code);toast('Code copié')}catch(e){prompt('Code d’invitation',HH.invite_code)}}
async function shareCode(){const t=inviteText();
  if(navigator.share){try{await navigator.share({title:'BudgetFoyer',text:t});return}catch(e){if(e&&e.name==='AbortError')return}}
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener')}
async function regenCode(){if(!confirm('Créer un nouveau code ? L’ancien ne fonctionnera plus.'))return;
  const{data,error}=await SB.rpc('regenerate_invite',{p_household:HH.id});if(error){toast(cloudErr(error));return}
  HH.invite_code=data;store.set('bf_hh_'+ME.id,HH);render();toast('Nouveau code créé')}
async function removeMember(u){const m=MEMBERS.find(x=>x.user_id===u);if(!confirm('Retirer '+((m&&m.display_name)||'ce membre')+' du foyer ?'))return;
  const{error}=await SB.from('household_members').delete().eq('household_id',HH.id).eq('user_id',u);if(error){toast(cloudErr(error));return}
  await loadMembers();render();toast('Membre retiré')}
async function leaveHousehold(){if(!confirm('Quitter ce foyer ? Vous n’aurez plus accès à son budget.'))return;
  const{error}=await SB.from('household_members').delete().eq('household_id',HH.id).eq('user_id',ME.id);if(error){toast(cloudErr(error));return}
  if(CHAN){try{SB.removeChannel(CHAN)}catch(e){}CHAN=null}store.del('bf_cc_'+HH.id);store.del('bf_hh_'+ME.id);HH=null;D=null;LAST=new Map();renderHousehold()}
async function syncNow(){await refreshCloud();await loadMembers();render();toast(SYNC==='ok'?'Données à jour':'Connexion impossible pour le moment')}

/* --- Configuration de la synchronisation --- */
function openSyncConfig(){const c=store.get('bf_sb_config')||{};const dlg=$('#dlg');
  dlg.innerHTML=`<form onsubmit="saveSyncConfig(event)"><div class="dlg-h"><h2 id="dlg-title">Synchronisation familiale</h2><button type="button" class="icon-btn" onclick="closeDlg()" aria-label="Fermer">${I.close}</button></div>
   <div class="dlg-b"><p class="muted small">Renseignez l’URL et la clé publique (anon) de votre projet Supabase, visibles dans Project Settings, puis API. Les données locales de ce téléphone restent disponibles et pourront être reprises à la création du foyer.</p>
   <label class="f">URL du projet<input type="text" id="sb-url" required inputmode="url" placeholder="https://xxxx.supabase.co" value="${esc(c.url||'')}"></label>
   <label class="f">Clé publique (anon)<input type="text" id="sb-key" required autocomplete="off" value="${esc(c.key||'')}"></label></div>
   <div class="dlg-f"><button type="button" class="btn" onclick="closeDlg()">Annuler</button><button class="btn primary" type="submit">Activer la synchronisation</button></div></form>`;dlg.showModal()}
function saveSyncConfig(e){e.preventDefault();const url=$('#sb-url').value.trim().replace(/\/+$/,''),key=$('#sb-key').value.trim();
  if(!/^https:\/\/\S+$/.test(url)){toast('L’URL doit commencer par https://');return}store.set('bf_sb_config',{url,key});location.reload()}
function disableSync(){if(!confirm('Revenir au mode local sur cet appareil ? Les données du foyer restent en ligne.'))return;store.del('bf_sb_config');location.reload()}

window.addEventListener('online',()=>{if(CLOUD&&HH)refreshCloud()});
window.addEventListener('offline',()=>{if(CLOUD)setSync('off')});
document.addEventListener('visibilitychange',()=>{if(CLOUD&&HH&&document.visibilityState==='visible')refreshCloud()});
setInterval(()=>{if(CLOUD&&HH&&SYNC==='off'&&navigator.onLine!==false)refreshCloud()},30000);

/* ============ Démarrage ============ */
document.addEventListener('keydown',e=>{if(e.key==='n'&&D&&!e.target.closest('input,textarea,select')&&!$('#dlg').open){e.preventDefault();openTx()}});
window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(VIEW==='dash'&&D)drawDash()});
function localBoot(){CLOUD=false;const id=sess.get();const u=id&&users().find(x=>x.id===id);if(u)startApp(u);else renderAuth()}
(function boot(){const cfg=sbConfig();if(cfg)cloudBoot(cfg);else localBoot()})();
</script>
</body>
</html>
